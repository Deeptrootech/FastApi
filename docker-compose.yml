services:
  database:
    # here, We didn’t expose the database port.
    # because we’re not accessing it from the host machine.
    # Containers communicate over Docker’s internal network,
    # and our web container can conect & use databse via docker network. (see .env connection string)
    # since, we are not accessing database from out host pc then why we need to expose post to host.
    image: postgres:17
    container_name: project_management_postgres
    environment:
      POSTGRES_DB: project_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persistent DB storage
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_management_web
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"   # host:container
    volumes:
      - .:/projectmanagement      # mount your project for live reload
    depends_on:
      - database      # ensures Postgres starts first
volumes:
  postgres_data:
